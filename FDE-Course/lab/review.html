<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northstar review laboratory</title>
<style>body{font:17px/1.6 system-ui;background:#f7f6f2;color:#142735;max-width:900px;margin:48px auto;padding:0 24px}h1{font-size:38px}label{display:block;margin-top:20px}input,textarea,select,button{font:inherit;padding:12px;box-sizing:border-box}input,textarea{width:100%;border:1px solid #78909b;background:white}button{background:#0b5563;color:white;border:0;margin:16px 8px 8px 0;cursor:pointer}button:disabled{opacity:.45;cursor:default}pre{white-space:pre-wrap;background:#eaf1f3;padding:20px}small{color:#52636e}a{color:#0b5563}:focus-visible{outline:3px solid #b98a00;outline-offset:3px}</style>
<h1 id="title">Northstar review laboratory</h1><p id="scope">Synthetic data. Deterministic suggestions. Human decisions. No messages sent.</p><button id="language">Español</button>
<label id="tokenLabel" for="token">Training token</label><input id="token" type="password" autocomplete="off" placeholder="See lab README">
<label id="idLabel" for="id">Ticket identifier</label><input id="id" value="T001">
<label id="textLabel" for="text">Ticket text</label><textarea id="text" rows="3">I cannot login and need a password reset.</textarea>
<button id="suggest">Create suggestion</button><pre id="result" aria-live="polite">Ready.</pre>
<label id="queueLabel" for="queue">Review and choose queue</label><select id="queue"><option>access</option><option>billing</option><option>incident</option><option>manual</option></select>
<button id="save" disabled>Save human decision</button><button id="metrics">Inspect metrics</button><pre id="events" aria-live="polite">No decision recorded.</pre>
<script>
let current=null,es=false;const el=id=>document.getElementById(id);
async function call(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+el('token').value,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const v=await r.json();if(!r.ok)throw Error(r.status+': '+v.error);return v}
el('suggest').onclick=async()=>{current=null;el('save').disabled=true;try{current=await call('/api/triage',{id:el('id').value,text:el('text').value,status:'open',created_at:new Date().toISOString()});el('result').textContent=JSON.stringify(current,null,2);el('queue').value=current.queue;el('save').disabled=false}catch(e){el('result').textContent=e.message}};
el('save').onclick=async()=>{if(!current)return;try{el('events').textContent=JSON.stringify(await call('/api/decision',{suggestion_id:current.suggestion_id,queue:el('queue').value}),null,2);el('save').disabled=true}catch(e){el('events').textContent=e.message}};
el('metrics').onclick=async()=>{try{el('events').textContent=JSON.stringify(await call('/api/metrics'),null,2)}catch(e){el('events').textContent=e.message}};
el('language').onclick=()=>{es=!es;document.documentElement.lang=es?'es':'en';const pairs={title:['Northstar review laboratory','Laboratorio de revisión Northstar'],scope:['Synthetic data. Deterministic suggestions. Human decisions. No messages sent.','Datos sintéticos. Sugerencias deterministas. Decisiones humanas. Sin envío de mensajes.'],tokenLabel:['Training token','Token de formación'],idLabel:['Ticket identifier','Identificador del ticket'],textLabel:['Ticket text','Texto del ticket'],suggest:['Create suggestion','Crear sugerencia'],queueLabel:['Review and choose queue','Revisar y elegir cola'],save:['Save human decision','Guardar decisión humana'],metrics:['Inspect metrics','Examinar métricas']};for(const[id,v]of Object.entries(pairs))el(id).textContent=v[es?1:0];el('language').textContent=es?'English':'Español'};
</script></html>
