<svg viewBox="0 0 1000 300" role="img" aria-labelledby="dtitle ddesc" xmlns="http://www.w3.org/2000/svg">
        <title id="dtitle">The deployment loop</title>
        <desc id="ddesc">Seven phases in sequence: Recon, Immerse, Frame, Engineer, Sense, Land, Distill. A dashed arrow returns from Land to Sense for the outcome reading. A solid arrow returns from Distill to Frame to start the next loop.</desc>
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#52636E"/>
          </marker>
          <marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
            <path d="M0 0 L10 5 L0 10 z" fill="#B98A00"/>
          </marker>
        </defs>
        <line x1="96" y1="110" x2="902" y2="110" stroke="#52636E" stroke-width="2"/>

        <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
          <!-- nodes -->
          <g>
            <circle cx="70" cy="110" r="26" fill="#fff" stroke="#0B5563" stroke-width="3"/>
            <text x="70" y="117" font-size="20" font-weight="700" fill="#0B5563">1</text>
            <text x="70" y="165" font-size="16" font-weight="700" fill="#12222B">Recon</text>
            <text x="70" y="186" font-size="12.5" fill="#52636E">Site Map v0</text>
            <text x="70" y="203" font-size="12.5" fill="#52636E">draft frame</text>
          </g>
          <g>
            <circle cx="213" cy="110" r="26" fill="#fff" stroke="#0B5563" stroke-width="3"/>
            <text x="213" y="117" font-size="20" font-weight="700" fill="#0B5563">2</text>
            <text x="213" y="165" font-size="16" font-weight="700" fill="#12222B">Immerse</text>
            <text x="213" y="186" font-size="12.5" fill="#52636E">Site Map v1</text>
            <text x="213" y="203" font-size="12.5" fill="#52636E">say/do gap log</text>
          </g>
          <g>
            <circle cx="356" cy="110" r="26" fill="#fff" stroke="#0B5563" stroke-width="3"/>
            <text x="356" y="117" font-size="20" font-weight="700" fill="#0B5563">3</text>
            <text x="356" y="165" font-size="16" font-weight="700" fill="#12222B">Frame</text>
            <text x="356" y="186" font-size="12.5" fill="#52636E">Frame Card</text>
            <text x="356" y="203" font-size="12.5" fill="#52636E">agreed with operator</text>
          </g>
          <g>
            <circle cx="499" cy="110" r="26" fill="#fff" stroke="#0B5563" stroke-width="3"/>
            <text x="499" y="117" font-size="20" font-weight="700" fill="#0B5563">4</text>
            <text x="499" y="165" font-size="16" font-weight="700" fill="#12222B">Engineer</text>
            <text x="499" y="186" font-size="12.5" fill="#52636E">live thin slice</text>
            <text x="499" y="203" font-size="12.5" fill="#52636E">written prediction</text>
          </g>
          <g>
            <circle cx="642" cy="110" r="26" fill="#fff" stroke="#B98A00" stroke-width="4"/>
            <text x="642" y="117" font-size="20" font-weight="700" fill="#B98A00">5</text>
            <text x="642" y="165" font-size="16" font-weight="700" fill="#12222B">Sense</text>
            <text x="642" y="186" font-size="12.5" fill="#52636E">delta log</text>
            <text x="642" y="203" font-size="12.5" fill="#52636E">gate decision</text>
          </g>
          <g>
            <circle cx="785" cy="110" r="26" fill="#fff" stroke="#0B5563" stroke-width="3"/>
            <text x="785" y="117" font-size="20" font-weight="700" fill="#0B5563">6</text>
            <text x="785" y="165" font-size="16" font-weight="700" fill="#12222B">Land</text>
            <text x="785" y="186" font-size="12.5" fill="#52636E">landing checklist</text>
            <text x="785" y="203" font-size="12.5" fill="#52636E">named site owner</text>
          </g>
          <g>
            <circle cx="928" cy="110" r="26" fill="#fff" stroke="#0B5563" stroke-width="3"/>
            <text x="928" y="117" font-size="20" font-weight="700" fill="#0B5563">7</text>
            <text x="928" y="165" font-size="16" font-weight="700" fill="#12222B">Distill</text>
            <text x="928" y="186" font-size="12.5" fill="#52636E">distill pack</text>
            <text x="928" y="203" font-size="12.5" fill="#52636E">site capability</text>
          </g>

          <!-- outcome reading arc: Land back to Sense -->
          <path d="M785 82 C785 26 642 26 642 80" fill="none" stroke="#B98A00" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ahg)"/>
          <text x="713" y="26" font-size="12.5" font-weight="600" fill="#B98A00">Outcome reading</text>

          <!-- reframe return: Distill back to Frame -->
          <path d="M928 222 V262 H356 V226" fill="none" stroke="#52636E" stroke-width="2" marker-end="url(#ah)"/>
          <text x="642" y="284" font-size="13" fill="#52636E">Reframe and start the next loop</text>
        </g>
      </svg>
